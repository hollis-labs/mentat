name: build
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    uses: hollis-labs/tools/.github/workflows/go-app-build.yml@145fb50d827a1af7e38236eda5751cee22970ba5   # tools main (extra_files, pre_test_cmd)
    with:
      app: mentat
      main_pkg: ./cmd/mentat
      test_cmd: "go vet ./... && go test -race -count=1 -timeout=5m ./..."
      ldflags_var: "main.version"     # matches the installed binary's -X main.version=
      extra_files: deploy.yaml
