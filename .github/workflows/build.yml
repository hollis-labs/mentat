name: build
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    uses: hollis-labs/tools/.github/workflows/go-app-build.yml@build/ci-artifact-20261024   # branch ref for the first test; pin to a sha after tools PR 9 merges
    with:
      app: mentat
      main_pkg: ./cmd/mentat
      test_cmd: "go vet ./... && go test -race -count=1 -timeout=5m ./..."
      ldflags_var: "main.version"     # matches the installed binary's -X main.version=
