name: build
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    uses: hollis-labs/tools/.github/workflows/go-app-build.yml@27c5d904a7dfafbb71dca884b0d31fc0849d39fb   # tools#9 merge commit
    with:
      app: mentat
      main_pkg: ./cmd/mentat
      test_cmd: "go vet ./... && go test -race -count=1 -timeout=5m ./..."
      ldflags_var: "main.version"     # matches the installed binary's -X main.version=
