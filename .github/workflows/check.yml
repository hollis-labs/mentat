name: Go checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: '4'
      GOFLAGS: -p=2
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Lint (golangci-lint v2.11.4, whole repo)
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run --max-issues-per-linter=0 --max-same-issues=0
      - name: Build
        run: go build -o "$RUNNER_TEMP/mentat" ./cmd/mentat
      - name: Race tests
        run: go test -race -count=1 -timeout=5m ./...
      - name: App pins match the BOM
        run: go run github.com/hollis-labs/substrate/cmd/substrate pins check --app .
      - name: Generated wiring is current
        run: |
          go run github.com/hollis-labs/substrate/cmd/substrate generate -f cmd/mentat/substrate.yaml
          git diff --exit-code cmd/mentat/substrate_wiring.go
      # The tree must be clean; the history gate returns after the program-wide history rewrite pass.
      - name: Public-repo scan (tree)
        run: python3 scripts/scan-public --tree
